[versions]
agp = "8.7.3"
android-compileSdk = "35"
android-minSdk = "24"
android-targetSdk = "35"
androidx-activity = "1.10.1"
androidx-appcompat = "1.7.1"
androidx-core = "1.16.0"
androidx-espresso = "3.6.1"
androidx-lifecycle = "2.9.1"
androidx-testExt = "1.2.1"
composeMultiplatform = "1.8.2"
junit = "4.13.2"
kotlin = "2.1.21"
ktor = "3.2.3"
logback = "1.5.18"


 # Navigation
backHandler = "1.8.2"
navigation = "2.9.0-beta04"

  # Compose & UI
coil-svg = "3.2.0"
coil = "3.2.0"
material = "1.12.0"
material-icons = "1.7.8"
material3 = "1.3.2"
material3-adaptive-navigation = "1.5.0-alpha01"

 # splashscreen
splashscreen = "1.0.1"

 # Koin
koin = "4.1.0"

 # Data
ksp = "2.1.21-2.0.2"
datastore = "1.1.7"
lifecycle-runtime = "2.7.0"
russhwolf = "1.3.0"

 # Language
lyricist = "1.7.0"


[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }


 # Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverNetty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }

 # Data
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime" }
com-russhwolf = { group = "com.russhwolf", name = "multiplatform-settings-no-arg" , version.ref = "russhwolf"}


 # Compose & UI
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" , version.ref = "material-icons"}
io-coil-kt-coil3 = { group = "io.coil-kt.coil3", name = "coil-svg" , version.ref = "coil-svg"}
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

 # splashscreen
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

 # Material 3
material3 = { group = "androidx.compose.material3", name = "material3" , version.ref = "material3"}
material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" , version.ref = "material3"}
material3-adaptive-navigation = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" , version.ref = "material3-adaptive-navigation"}

 # Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

 # Navigation
navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
backHandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "backHandler" }

 # Language
lyricist = { module = "cafe.adriel.lyricist:lyricist", version.ref = "lyricist" }
lyricist-processor = { module = "cafe.adriel.lyricist:lyricist-processor", version.ref = "lyricist" }
lyricist-processor-xml = { module = "cafe.adriel.lyricist:lyricist-processor-xml", version.ref = "lyricist" }



[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }


 #Data
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }